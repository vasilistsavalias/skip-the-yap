<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset="1" stop-color="#101b34"/></linearGradient><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#4f46e5"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#020617" flood-opacity=".5"/></filter></defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="78" y="122" fill="#f8fafc" font-size="48" font-weight="760">Your key. Your provider.</text>
    <text x="78" y="168" fill="#a9b8cf" font-size="20">No Skip the Yap! account. No developer-operated backend.</text>
    <g transform="translate(78 244)">
      <g><rect width="260" height="150" rx="22" fill="#111c2f" stroke="#30435f"/><circle cx="130" cy="50" r="26" fill="url(#brand)"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><rect x="124" y="34" width="12" height="22" rx="6"/><path d="M118 49v1a12 12 0 0 0 24 0v-1M130 62v7M123 69h14"/></g><text x="130" y="104" fill="#f8fafc" font-size="18" font-weight="700" text-anchor="middle">Selected voice note</text><text x="130" y="128" fill="#8fa0b8" font-size="14" text-anchor="middle">Only after you click</text></g>
      <path d="M280 75h96" stroke="#4a6b9d" stroke-width="3"/><path d="M366 67l12 8-12 8" fill="none" stroke="#78a9f5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(398)"><rect width="260" height="150" rx="22" fill="#111c2f" stroke="#30435f"/><path d="M130 27l30 13v22c0 27-17 42-30 49-13-7-30-22-30-49V40z" fill="#153c78" stroke="#60a5fa" stroke-width="2"/><path d="M117 67l9 9 19-22" fill="none" stroke="#dbeafe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="123" fill="#f8fafc" font-size="18" font-weight="700" text-anchor="middle">Your AI provider</text></g>
      <path d="M678 75h96" stroke="#4a6b9d" stroke-width="3"/><path d="M764 67l12 8-12 8" fill="none" stroke="#78a9f5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(796)"><rect width="260" height="150" rx="22" fill="#111c2f" stroke="#30435f"/><rect x="75" y="30" width="110" height="62" rx="14" fill="#1d4ed8"/><path d="M96 109h68" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/><text x="130" y="62" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Transcript</text><text x="130" y="123" fill="#f8fafc" font-size="18" font-weight="700" text-anchor="middle">Back in your chat</text></g>
    </g>
    <g transform="translate(78 486)">
      <rect width="1056" height="190" rx="24" fill="#0d1728" stroke="#2b3d58" filter="url(#shadow)"/>
      <g transform="translate(38 34)"><circle cx="18" cy="18" r="18" fill="#064e3b" stroke="#10b981"/><path d="M10 18l5 5 11-12" fill="none" stroke="#d1fae5" stroke-width="2.5"/><text x="52" y="14" fill="#f8fafc" font-size="18" font-weight="700">No analytics or ads</text><text x="52" y="40" fill="#91a4bf" font-size="15">Nothing follows you around.</text></g>
      <g transform="translate(390 34)"><circle cx="18" cy="18" r="18" fill="#064e3b" stroke="#10b981"/><path d="M10 18l5 5 11-12" fill="none" stroke="#d1fae5" stroke-width="2.5"/><text x="52" y="14" fill="#f8fafc" font-size="18" font-weight="700">No transcript history</text><text x="52" y="40" fill="#91a4bf" font-size="15">The extension does not retain results.</text></g>
      <g transform="translate(744 34)"><circle cx="18" cy="18" r="18" fill="#064e3b" stroke="#10b981"/><path d="M10 18l5 5 11-12" fill="none" stroke="#d1fae5" stroke-width="2.5"/><text x="52" y="14" fill="#f8fafc" font-size="18" font-weight="700">Saved locally</text><text x="52" y="40" fill="#91a4bf" font-size="15">Clear keys and settings anytime.</text></g>
      <path d="M38 108h980" stroke="#26364d"/><text x="38" y="148" fill="#60a5fa" font-size="17" font-weight="700">Free and open source</text><text x="230" y="148" fill="#8fa0b8" font-size="16">Provider processing follows the provider's own terms and privacy policy.</text>
    </g>
  </g>
</svg>
