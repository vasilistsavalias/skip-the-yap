<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070A12"/><stop offset="1" stop-color="#17233C"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".45"/></filter></defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <g font-family="Segoe UI,Arial">
    <text x="88" y="126" fill="#F8FAFC" font-size="42" font-weight="750">Fallbacks you control</text>
    <text x="88" y="170" fill="#A9B8CF" font-size="20">Providers and models run in the exact order you choose.</text>
    <g transform="translate(730 54)" filter="url(#shadow)">
      <rect width="452" height="692" rx="20" fill="#101827" stroke="#34435D"/>
      <text x="26" y="45" fill="#F8FAFC" font-size="20" font-weight="700">Advanced fallback</text><rect x="368" y="21" width="54" height="28" rx="14" fill="#2563EB"/><circle cx="407" cy="35" r="10" fill="#FFF"/>
      <text x="26" y="82" fill="#A9B8CF" font-size="13">Try another configured provider after a temporary failure.</text>
      <g transform="translate(22 108)"><rect width="408" height="142" rx="14" fill="#1A273A" stroke="#4F74AD"/><circle cx="30" cy="32" r="16" fill="#2563EB"/><text x="30" y="38" fill="#FFF" text-anchor="middle" font-size="14">1</text><text x="58" y="34" fill="#FFF" font-size="17" font-weight="700">Gemini</text><text x="58" y="56" fill="#91A4BF" font-size="12">Free tier · All modes</text><text x="378" y="35" fill="#66E2A3" font-size="12" text-anchor="end">● Configured</text><rect x="22" y="82" width="364" height="40" rx="8" fill="#101827"/><text x="38" y="107" fill="#D8E3F3" font-size="13">Model fallback · 8 enabled</text><text x="366" y="107" fill="#91A4BF" font-size="15" text-anchor="end">⌄</text></g>
      <g transform="translate(22 266)"><rect width="408" height="142" rx="14" fill="#1A273A" stroke="#34435D"/><circle cx="30" cy="32" r="16" fill="#334155"/><text x="30" y="38" fill="#FFF" text-anchor="middle" font-size="14">2</text><text x="58" y="34" fill="#FFF" font-size="17" font-weight="700">Groq</text><text x="58" y="56" fill="#91A4BF" font-size="12">Free tier · All modes</text><text x="378" y="35" fill="#66E2A3" font-size="12" text-anchor="end">● Configured</text><rect x="22" y="82" width="364" height="40" rx="8" fill="#101827"/><text x="38" y="107" fill="#D8E3F3" font-size="13">Model fallback · 2 enabled</text><text x="366" y="107" fill="#91A4BF" font-size="15" text-anchor="end">⌄</text></g>
      <g transform="translate(22 424)"><rect width="408" height="142" rx="14" fill="#1A273A" stroke="#34435D"/><circle cx="30" cy="32" r="16" fill="#334155"/><text x="30" y="38" fill="#FFF" text-anchor="middle" font-size="14">3</text><text x="58" y="34" fill="#FFF" font-size="17" font-weight="700">OpenAI</text><text x="58" y="56" fill="#91A4BF" font-size="12">Pay as you go · Verbatim</text><text x="378" y="35" fill="#66E2A3" font-size="12" text-anchor="end">● Configured</text><rect x="22" y="82" width="364" height="40" rx="8" fill="#101827"/><text x="38" y="107" fill="#D8E3F3" font-size="13">Model fallback · 3 enabled</text><text x="366" y="107" fill="#91A4BF" font-size="15" text-anchor="end">⌄</text></g>
      <rect x="22" y="590" width="408" height="46" rx="10" fill="#162238" stroke="#3B4A62"/><text x="226" y="619" fill="#A9B8CF" font-size="14" text-anchor="middle">＋ Add another provider</text>
      <text x="22" y="668" fill="#8190A8" font-size="12">Authentication, quota, and transient failures remain visible.</text>
    </g>
    <g transform="translate(88 244)">
      <g><rect width="540" height="82" rx="16" fill="#111C2F" stroke="#2D4366"/><circle cx="46" cy="41" r="21" fill="#2563EB"/><text x="46" y="48" fill="#FFF" font-size="18" text-anchor="middle">1</text><text x="84" y="36" fill="#F8FAFC" font-size="18" font-weight="700">One audio capture</text><text x="84" y="60" fill="#A9B8CF" font-size="15">The selected voice note is read once and validated.</text></g>
      <path d="M270 82v42" stroke="#4B6A98" stroke-width="3" stroke-linecap="round"/>
      <g transform="translate(0 124)"><rect width="540" height="82" rx="16" fill="#111C2F" stroke="#2D4366"/><circle cx="46" cy="41" r="21" fill="#2563EB"/><text x="46" y="48" fill="#FFF" font-size="18" text-anchor="middle">2</text><text x="84" y="36" fill="#F8FAFC" font-size="18" font-weight="700">Provider-specific packaging</text><text x="84" y="60" fill="#A9B8CF" font-size="15">JSON, multipart, or raw bytes — without recapturing.</text></g>
      <path d="M270 206v42" stroke="#4B6A98" stroke-width="3" stroke-linecap="round"/>
      <g transform="translate(0 248)"><rect width="540" height="82" rx="16" fill="#111C2F" stroke="#2D4366"/><circle cx="46" cy="41" r="21" fill="#2563EB"/><text x="46" y="48" fill="#FFF" font-size="18" text-anchor="middle">3</text><text x="84" y="36" fill="#F8FAFC" font-size="18" font-weight="700">Explicit result</text><text x="84" y="60" fill="#A9B8CF" font-size="15">The transcript names the provider and model that succeeded.</text></g>
    </g>
  </g>
