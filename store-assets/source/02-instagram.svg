      <text y="126" fill="#f8fafc" font-size="48" font-weight="760">It stays with</text><text y="182" fill="#f8fafc" font-size="48" font-weight="760">the voice note.</text>
      <text y="238" fill="#b6b9d5" font-size="20">Scroll all you want. Each button stays</text><text y="270" fill="#b6b9d5" font-size="20">beside the message it belongs to.</text>
