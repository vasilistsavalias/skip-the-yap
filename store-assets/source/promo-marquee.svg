<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Skip the Yap!</title>
  <desc id="desc">Voice notes become readable text in one click.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07101F"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2F7BFF"/>
      <stop offset="1" stop-color="#5946E8"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="560" fill="url(#background)"/>
  <circle cx="1190" cy="20" r="300" fill="#2F7BFF" opacity=".08"/>
  <circle cx="1260" cy="590" r="340" fill="#5946E8" opacity=".1"/>

  <g transform="translate(118 100)">
    <rect width="360" height="360" rx="90" fill="url(#mark)"/>
    <path d="M65 85h230a36 36 0 0 1 36 36v114a36 36 0 0 1-36 36h-91l-50 42v-42H65a36 36 0 0 1-36-36V121a36 36 0 0 1 36-36Z" fill="#FFF"/>
    <g fill="url(#mark)">
      <rect x="71" y="166" width="14" height="40" rx="7"/>
      <rect x="97" y="137" width="14" height="100" rx="7"/>
      <rect x="123" y="155" width="14" height="64" rx="7"/>
      <rect x="149" y="125" width="14" height="124" rx="7"/>
      <rect x="189" y="143" width="109" height="15" rx="7.5"/>
      <rect x="189" y="179" width="90" height="15" rx="7.5"/>
      <rect x="189" y="215" width="64" height="15" rx="7.5"/>
    </g>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="555" y="208" fill="#FFF" font-size="80" font-weight="750">Skip the Yap!</text>
    <text x="559" y="282" fill="#C9D7EC" font-size="36" font-weight="600">Let them yap. You get the point.</text>
    <text x="559" y="350" fill="#94A8C6" font-size="25">Voice notes become readable text in one click.</text>
    <text x="559" y="430" fill="#8DD7FF" font-size="21" font-weight="700">MESSENGER  ·  INSTAGRAM  ·  OPEN SOURCE</text>
  </g>
</svg>
