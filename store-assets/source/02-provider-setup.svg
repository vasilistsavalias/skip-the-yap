<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101F"/><stop offset="1" stop-color="#15213A"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity=".5"/></filter></defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <g font-family="Segoe UI,Arial">
    <text x="92" y="132" fill="#F8FAFC" font-size="42" font-weight="750">Bring your own provider key</text>
    <text x="92" y="176" fill="#A9B8CF" font-size="20">Choose one provider for a simple setup.</text>
    <text x="92" y="206" fill="#A9B8CF" font-size="20">Add fallbacks only when you want them.</text>
    <g transform="translate(694 54)" filter="url(#shadow)">
      <rect width="460" height="730" rx="20" fill="#101827" stroke="#34435D"/>
      <rect width="460" height="72" rx="20" fill="#111B2D"/><text x="30" y="45" fill="#F8FAFC" font-size="21" font-weight="700">Skip the Yap!</text><circle cx="416" cy="36" r="5" fill="#5EE9A4"/>
      <rect x="22" y="92" width="416" height="334" rx="14" fill="#1B2738" stroke="#35445B"/>
      <text x="38" y="126" fill="#F8FAFC" font-size="16" font-weight="700">Transcription provider</text><rect x="38" y="140" width="384" height="44" rx="9" fill="#0E1726" stroke="#40516B"/><text x="54" y="168" fill="#EEF4FF" font-size="15">Gemini — all modes</text><text x="398" y="168" fill="#A9B8CF" font-size="18" text-anchor="end">⌄</text>
      <text x="38" y="220" fill="#F8FAFC" font-size="16" font-weight="700">Gemini API key</text><rect x="38" y="234" width="384" height="44" rx="9" fill="#0E1726" stroke="#40516B"/><text x="54" y="262" fill="#8FA0B8" font-size="17">••••••••••••••••••••••••</text>
      <rect x="38" y="292" width="384" height="44" rx="9" fill="#2563EB"/><text x="230" y="320" fill="#FFF" font-size="15" font-weight="700" text-anchor="middle">Test Gemini</text>
      <text x="38" y="362" fill="#8DD7FF" font-size="14">How to get a Gemini API key  ▾</text>
      <text x="38" y="394" fill="#A9B8CF" font-size="12">Keys stay in Chrome storage. Audio is sent only when you transcribe.</text>
      <text x="22" y="454" fill="#F8FAFC" font-size="16" font-weight="700">Transcription mode</text>
      <rect x="22" y="468" width="416" height="56" rx="10" fill="#21437A" stroke="#5BA0FF" stroke-width="2"/><text x="38" y="501" fill="#FFF" font-size="15">🎯</text><text x="70" y="492" fill="#FFF" font-size="14" font-weight="700">Verbatim</text><text x="70" y="511" fill="#DCEAFF" font-size="11">Exact wording, including slang and filler.</text><circle cx="414" cy="496" r="8" fill="#5BA0FF"/><circle cx="414" cy="496" r="3" fill="#101827"/>
      <rect x="22" y="532" width="416" height="56" rx="10" fill="#111B2D" stroke="#34435D"/><text x="38" y="565" fill="#FFF" font-size="15">✨</text><text x="70" y="556" fill="#FFF" font-size="14" font-weight="700">Cleaned</text><text x="70" y="575" fill="#A9B8CF" font-size="11">Removes stutters and filler; improves punctuation.</text><circle cx="414" cy="560" r="8" fill="none" stroke="#8FA0B8"/>
      <rect x="22" y="596" width="416" height="56" rx="10" fill="#111B2D" stroke="#34435D"/><text x="38" y="629" fill="#FFF" font-size="15">📝</text><text x="70" y="620" fill="#FFF" font-size="14" font-weight="700">TL;DR</text><text x="70" y="639" fill="#A9B8CF" font-size="11">Summarizes key points and requests in 1–3 bullets.</text><circle cx="414" cy="624" r="8" fill="none" stroke="#8FA0B8"/>
      <rect x="22" y="670" width="416" height="44" rx="10" fill="#1B2738" stroke="#34435D"/><text x="38" y="698" fill="#F8FAFC" font-size="15" font-weight="700">Advanced fallback</text><text x="408" y="699" fill="#77A8FF" font-size="22" text-anchor="end">○</text>
    </g>
    <g fill="#E7EEF9" font-size="19">
      <circle cx="112" cy="272" r="18" fill="#2563EB"/><text x="112" y="279" fill="#FFF" font-size="17" text-anchor="middle">1</text><text x="150" y="279">Select a provider</text>
      <circle cx="112" cy="338" r="18" fill="#2563EB"/><text x="112" y="345" fill="#FFF" font-size="17" text-anchor="middle">2</text><text x="150" y="345">Paste your own key</text>
      <circle cx="112" cy="404" r="18" fill="#2563EB"/><text x="112" y="411" fill="#FFF" font-size="17" text-anchor="middle">3</text><text x="150" y="411">Test before transcribing</text>
    </g>
    <rect x="92" y="492" width="510" height="142" rx="18" fill="#101A2B" stroke="#2B3A53"/><text x="118" y="528" fill="#8DD7FF" font-size="15" font-weight="700">SUPPORTED PROVIDERS</text><text x="118" y="568" fill="#F8FAFC" font-size="18">Gemini · Groq · Hugging Face · OpenAI</text><text x="118" y="600" fill="#F8FAFC" font-size="18">xAI · ElevenLabs · OpenRouter</text>
  </g>
</svg>
