<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Skip the Yap!</title>
  <desc id="desc">Voice notes without the listening.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101F"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2F7BFF"/><stop offset="1" stop-color="#5946E8"/></linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1060" cy="88" r="240" fill="#2F7BFF" opacity=".08"/>
  <circle cx="1120" cy="600" r="300" fill="#5946E8" opacity=".1"/>
  <g transform="translate(116 112)">
    <rect width="304" height="304" rx="76" fill="url(#surface)"/>
    <path d="M55 72h194a31 31 0 0 1 31 31v96a31 31 0 0 1-31 31h-77l-42 35v-35H55a31 31 0 0 1-31-31v-96a31 31 0 0 1 31-31Z" fill="#FFF"/>
