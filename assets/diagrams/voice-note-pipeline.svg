<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Skip the Yap! voice-note transcription pipeline</title>
  <desc id="desc">Six steps show a selected voice note moving from a user click, through bounded capture and validation, directly to the configured AI provider, and back as text inserted into the active chat composer with optional clipboard copying.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f2e61" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#184d8f"/></marker>
  </defs>
  <rect width="1280" height="720" rx="22" fill="url(#background)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="640" y="54" fill="#0c2e63" font-size="31" font-weight="700" text-anchor="middle">Skip the Yap! Voice Note Pipeline</text>
    <text x="640" y="84" fill="#506784" font-size="15" text-anchor="middle">From one click to editable text in the active conversation</text>

    <path d="M388 216h42" fill="none" stroke="#184d8f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M818 216h42" fill="none" stroke="#184d8f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1078 310v72" fill="none" stroke="#184d8f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M892 490h-48" fill="none" stroke="#184d8f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M462 490h-48" fill="none" stroke="#184d8f" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(42 122)" filter="url(#shadow)">
      <rect width="346" height="188" rx="18" fill="#ffffff" stroke="#184d8f" stroke-width="1.5"/>
      <circle cx="32" cy="32" r="19" fill="#0c2e63"/><text x="32" y="39" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">1</text>
      <text x="62" y="38" fill="#0c2e63" font-size="18" font-weight="700">Click the mic</text>
      <circle cx="173" cy="91" r="27" fill="url(#brand)"/><g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><rect x="166" y="73" width="14" height="25" rx="7"/><path d="M159 91v2a14 14 0 0 0 28 0v-2M173 107v8M165 115h16"/></g>
      <text x="173" y="140" fill="#283e5b" font-size="15" text-anchor="middle">A trusted click selects</text>
      <text x="173" y="161" fill="#283e5b" font-size="15" text-anchor="middle">one supported voice note</text>
    </g>

    <g transform="translate(430 122)" filter="url(#shadow)">
      <rect width="388" height="188" rx="18" fill="#ffffff" stroke="#184d8f" stroke-width="1.5"/>
      <circle cx="32" cy="32" r="19" fill="#0c2e63"/><text x="32" y="39" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">2</text>
      <text x="62" y="38" fill="#0c2e63" font-size="18" font-weight="700">Capture and validate</text>
      <g transform="translate(24 64)">
        <rect width="340" height="42" rx="12" fill="#eef4ff"/><circle cx="24" cy="21" r="11" fill="#2563eb"/><path d="M20 15l10 6-10 6z" fill="#fff"/><path d="M48 21h87" stroke="#6a84a8" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 8"/><text x="157" y="27" fill="#283e5b" font-size="14" font-weight="600">Selected audio source</text>
        <rect y="56" width="164" height="42" rx="12" fill="#f5f2ff" stroke="#b7a5f5"/><text x="82" y="82" fill="#46338d" font-size="13" text-anchor="middle">Type and size checked</text>
        <rect x="176" y="56" width="164" height="42" rx="12" fill="#f5f2ff" stroke="#b7a5f5"/><text x="258" y="82" fill="#46338d" font-size="13" text-anchor="middle">No mic recording</text>
      </g>
    </g>

    <g transform="translate(860 122)" filter="url(#shadow)">
      <rect width="378" height="188" rx="18" fill="#ffffff" stroke="#184d8f" stroke-width="1.5"/>
      <circle cx="32" cy="32" r="19" fill="#0c2e63"/><text x="32" y="39" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">3</text>
      <text x="62" y="38" fill="#0c2e63" font-size="18" font-weight="700">Send directly</text>
      <path d="M189 60l24 11v17c0 22-13 34-24 40-11-6-24-18-24-40V71z" fill="#e6f0ff" stroke="#2563eb" stroke-width="2"/><path d="M178 89l7 7 16-20" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="189" y="149" fill="#283e5b" font-size="14" font-weight="700" text-anchor="middle">HTTPS using your API key</text>
      <text x="189" y="171" fill="#60748f" font-size="13" text-anchor="middle">No developer-operated backend</text>
    </g>

    <g transform="translate(892 396)" filter="url(#shadow)">
      <rect width="346" height="188" rx="18" fill="#ffffff" stroke="#184d8f" stroke-width="1.5"/>
      <circle cx="32" cy="32" r="19" fill="#0c2e63"/><text x="32" y="39" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">4</text>
      <text x="62" y="38" fill="#0c2e63" font-size="18" font-weight="700">Provider transcribes</text>
      <g transform="translate(24 65)">
        <rect width="142" height="42" rx="11" fill="#ede9fe" stroke="#a78bfa"/><text x="71" y="26" fill="#49328f" font-size="13" font-weight="700" text-anchor="middle">Chosen provider</text>
        <rect x="156" width="142" height="42" rx="11" fill="#ede9fe" stroke="#a78bfa"/><text x="227" y="26" fill="#49328f" font-size="13" font-weight="700" text-anchor="middle">Chosen mode</text>
        <text x="149" y="74" fill="#60748f" font-size="13" text-anchor="middle">Verbatim · Cleaned · TL;DR · Custom</text>
        <text x="149" y="99" fill="#60748f" font-size="12" text-anchor="middle">Configured fallback only after retryable failure</text>
      </g>
    </g>

    <g transform="translate(462 396)" filter="url(#shadow)">
      <rect width="382" height="188" rx="18" fill="#ffffff" stroke="#184d8f" stroke-width="1.5"/>
      <circle cx="32" cy="32" r="19" fill="#0c2e63"/><text x="32" y="39" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">5</text>
      <text x="62" y="38" fill="#0c2e63" font-size="18" font-weight="700">Return the text</text>
      <g transform="translate(28 68)">
        <rect width="326" height="76" rx="14" fill="#eef4ff" stroke="#8bb6f5"/>
        <path d="M22 21h218M22 38h268M22 55h178" stroke="#5980b8" stroke-width="5" stroke-linecap="round"/>
      </g>
      <text x="191" y="169" fill="#60748f" font-size="13" text-anchor="middle">The extension keeps no transcript history</text>
    </g>

    <g transform="translate(42 396)" filter="url(#shadow)">
      <rect width="372" height="188" rx="18" fill="#ffffff" stroke="#184d8f" stroke-width="1.5"/>
      <circle cx="32" cy="32" r="19" fill="#0c2e63"/><text x="32" y="39" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">6</text>
      <text x="62" y="38" fill="#0c2e63" font-size="18" font-weight="700">Put it in the chat</text>
      <rect x="24" y="69" width="324" height="52" rx="18" fill="#eaf1fc" stroke="#7398ca"/><text x="46" y="101" fill="#283e5b" font-size="14">Transcript ready to review and edit</text><circle cx="322" cy="95" r="18" fill="url(#brand)"/><path d="M314 95h15M324 88l7 7-7 7" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="24" y="137" width="324" height="30" rx="15" fill="#e7f8f0" stroke="#2db67d"/><text x="186" y="157" fill="#176647" font-size="12" font-weight="700" text-anchor="middle">Active composer + optional clipboard</text>
    </g>

    <g transform="translate(282 630)">
      <rect width="716" height="50" rx="14" fill="#ffffff" stroke="#e08129" stroke-dasharray="5 4"/>
      <circle cx="29" cy="25" r="13" fill="#f59e0b"/><text x="29" y="30" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">i</text>
      <text x="54" y="30" fill="#714418" font-size="14" font-weight="600">Only the voice note you click enters this flow. Processing follows your provider's terms.</text>
    </g>
  </g>
</svg>
